<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>测测你的隐藏天赋</title>
<style>
:root {
  color-scheme: light;
  --ink: #281e38;
  --muted: #625570;
  --accent: #5836a7;
  --paper: #fffaff;
  --line: #e1d7ee;
  font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: #f6f2fc; color: var(--ink); line-height: 1.65; }
main { max-width: 900px; margin: auto; padding: 0 22px 24px; }
header, footer { padding: 16px 0; color: var(--muted); font-size: .9rem; }
header { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); }
footer { border-top: 1px solid var(--line); }
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: "Songti SC", SimSun, serif; line-height: 1.35; }
h1 { font-size: clamp(2.55rem, 7vw, 5rem); margin: 10px 0 16px; }
h1 em { color: var(--accent); font-style: normal; }
h2 { font-size: clamp(1.5rem, 4.5vw, 2.4rem); margin: 6px 0 15px; }
.kicker { color: var(--accent); font-weight: 700; }
.muted { color: var(--muted); }
.hero { display: grid; grid-template-columns: 1.1fr 1fr; align-items: center; gap: 30px; padding: 45px 0 28px; }
.hero-art {
  display: grid; place-items: center; aspect-ratio: 1.15; border-radius: 24px;
  background: radial-gradient(ellipse, #644a8e, #241a37 76%);
}
.hero-art svg { width: 76%; height: auto; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 0 25px; }
.tags span { background: var(--paper); border: 1px solid var(--line); border-radius: 99px; padding: 3px 12px; }
button { font: inherit; cursor: pointer; }
.button {
  min-height: 46px; padding: 8px 20px; border-radius: 99px; border: 1px solid transparent;
  background: var(--accent); color: white; font-weight: 700;
}
.button:hover:enabled { filter: brightness(.93); }
.button:disabled { background: #e6ddf1; color: #685b77; cursor: default; }
.secondary { background: var(--paper); color: var(--ink); border-color: var(--line); }
:focus-visible { outline: 3px solid #8b64d2; outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
.actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
#next { margin-inline-start: auto; }
.narrow { max-width: 740px; margin: auto; padding: 24px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: clamp(16px, 4vw, 28px); }
.progress-label { display: flex; justify-content: space-between; color: var(--muted); }
progress { display: block; width: 100%; height: 10px; margin: 8px 0 16px; accent-color: var(--accent); }
fieldset { min-width: 0; padding: 0; margin: 0; border: 0; display: grid; gap: 8px; }
.choice {
  display: grid; grid-template-columns: 20px minmax(0, 1fr); align-items: center; gap: 9px;
  min-height: 48px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; cursor: pointer;
}
.choice:hover { background: #f6effd; }
.choice:has(input:checked) { background: #ede2fc; border-color: #895dc7; }
.choice input { margin: 0; accent-color: var(--accent); }
.banner {
  padding: clamp(22px, 5vw, 40px); border-radius: 24px; color: #fff8ff;
  background: radial-gradient(ellipse at top right, hsl(var(--hue) 44% 39%), hsl(var(--hue) 35% 16%) 78%);
}
.banner .kicker, #ties { color: #f1e0ff; }
#ties { margin-top: 7px; font-size: .9rem; }
.profile { margin: 16px 0 12px; }
.profile-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 12px; align-items: center; }
#radar { display: block; width: 100%; max-width: 420px; height: auto; margin: auto; }
#scores { list-style: none; margin: 0; padding: 0; }
.score {
  display: grid; grid-template-columns: 2.6rem minmax(0, 1fr) 3.5rem;
  gap: 7px; align-items: center; padding: 4px 0; font-size: .9rem;
}
.score strong { text-align: right; font-variant-numeric: tabular-nums; }
.track { height: 6px; border-radius: 10px; overflow: hidden; background: #eae0f3; }
.track span { display: block; height: 100%; border-radius: inherit; background: #8056c7; }
.details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.details h3 { margin-bottom: 5px; font-size: 1.05rem; }
dialog {
  width: min(420px, calc(100% - 24px)); max-height: calc(100dvh - 24px); padding: 14px;
  border: 1px solid var(--line); border-radius: 19px; color: var(--ink); background: var(--paper);
}
dialog::backdrop { background: #221632bd; }
.dialog-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
#poster { display: block; width: min(100%, max(135px, calc((100dvh - 190px) * .75))); height: auto; margin: auto; border-radius: 10px; }
.enter { animation: enter .26s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@media (max-width: 620px) {
  main { padding-inline: 14px; }
  .hero, .profile-grid, .details { grid-template-columns: 1fr; }
  .hero { padding-top: 25px; gap: 18px; }
  .hero-art { aspect-ratio: 1.6; }
  .hero-art svg { width: 62%; }
}
@media (prefers-reduced-motion: reduce) { .enter { animation: none; } }
</style>
</head>
<body>
<main>
  <header><strong>✦ 天赋档案</strong><span>趣味人格测试</span></header>

  <section id="home">
    <div class="hero">
      <div>
        <p class="kicker">日常偏好小测试</p>
        <h1>测测你的<br><em>隐藏天赋</em></h1>
        <p class="muted">从 40 个生活场景里，找找你最顺手的那种本领。</p>
        <div class="actions"><button class="button" id="start" type="button">开始测试</button></div>
        <p class="muted">40 道单选题 · 约 6–8 分钟</p>
      </div>
      <div class="hero-art" aria-hidden="true">
        <svg viewBox="0 0 260 260" fill="none" stroke="#e7ceff">
          <circle cx="130" cy="130" r="120" opacity=".32"/>
          <circle cx="130" cy="130" r="105" opacity=".3" stroke-dasharray="2 6"/>
          <ellipse cx="130" cy="130" rx="96" ry="50" transform="rotate(15 130 130)"/>
          <ellipse cx="130" cy="130" rx="96" ry="50" transform="rotate(45 130 130)" opacity=".85"/>
          <ellipse cx="130" cy="130" rx="96" ry="50" transform="rotate(75 130 130)" opacity=".8"/>
          <ellipse cx="130" cy="130" rx="96" ry="50" transform="rotate(105 130 130)" opacity=".75"/>
          <ellipse cx="130" cy="130" rx="96" ry="50" transform="rotate(135 130 130)" opacity=".7"/>
          <ellipse cx="130" cy="130" rx="96" ry="50" transform="rotate(165 130 130)" opacity=".65"/>
          <path d="M130 98q3 29 32 32-29 3-32 32-3-29-32-32 29-3 32-32Z" fill="#f2dbff"/>
        </svg>
      </div>
    </div>
    <h3>九种天赋维度</h3>
    <div id="tags" class="tags"></div>
  </section>

  <section id="quiz" class="narrow" aria-labelledby="prompt" hidden>
    <div class="progress-label">
      <label for="progress">答题进度</label><span id="progress-text"></span>
    </div>
    <progress id="progress" value="0" max="40"></progress>
    <article class="card" id="question-card">
      <p id="question-number" class="kicker"></p>
      <h2 id="prompt" tabindex="-1"></h2>
      <form id="question-form">
        <fieldset id="choices" aria-labelledby="prompt"></fieldset>
        <div class="actions">
          <button class="button secondary" id="previous" type="button">上一题</button>
          <button class="button" id="next" type="submit" disabled>下一题</button>
        </div>
      </form>
    </article>
  </section>

  <section id="result" class="narrow" aria-labelledby="result-title" hidden>
    <article id="banner" class="banner">
      <p id="result-label" class="kicker"></p>
      <h2 id="result-title" tabindex="-1"></h2>
      <p id="quote"></p>
      <p id="ties" hidden></p>
    </article>
    <div class="actions">
      <button class="button" id="share" type="button">查看分享卡</button>
      <button class="button secondary" id="restart" type="button">重新测试</button>
    </div>
    <section class="card profile" aria-labelledby="profile-title">
      <h3 id="profile-title">九维天赋雷达图</h3>
      <p class="muted" id="scale-note"></p>
      <div class="profile-grid">
        <svg id="radar" viewBox="0 0 360 340" role="img" aria-labelledby="radar-title radar-desc">
          <title id="radar-title">九个天赋维度的答题分布</title>
          <desc id="radar-desc"></desc>
          <g id="radar-plot" aria-hidden="true"></g>
        </svg>
        <ul id="scores" aria-label="各维度选中比例"></ul>
      </div>
    </section>
    <div id="details" class="details"></div>
  </section>

  <footer>测测你的隐藏天赋 · 结果仅供娱乐与自我探索</footer>
</main>

<dialog id="share-dialog" aria-labelledby="share-title">
  <div class="dialog-top">
    <h3 id="share-title">分享卡</h3>
    <form method="dialog"><button class="button secondary" autofocus>关闭</button></form>
  </div>
  <canvas id="poster" width="1080" height="1440" role="img"></canvas>
  <div class="actions">
    <button class="button" id="save" type="button">保存 PNG</button>
    <span class="muted" id="save-status" role="status">也可以直接截图</span>
  </div>
</dialog>

<noscript><p>请启用 JavaScript 后重新打开此网页。</p></noscript>

const el = id => document.getElementById(id);
const indices = talents.map((_, index) => index);
const opportunities = talents.map(() => 0);
for (const [, ...options] of questions) {
  for (const [dimension] of options) opportunities[dimension]++;
}

let answers = [];
let optionOrders = [];
let current = 0;
let outcome = null;

function make(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function animate(node) {
  node.classList.remove("enter");
  void node.offsetWidth;
  node.classList.add("enter");
}

function show(screen, heading) {
  for (const id of ["home", "quiz", "result"]) el(id).hidden = id !== screen;
  window.scrollTo(0, 0);
  el(heading).focus({ preventScroll: true });
}

function shuffle(options) {
  const order = [...options];
  for (let index = order.length - 1; index > 0; index--) {
    const other = Math.floor(Math.random() * (index + 1));
    [order[index], order[other]] = [order[other], order[index]];
  }
  return order;
}

function begin() {
  answers = Array(questions.length).fill(null);
  optionOrders = questions.map(([, ...options]) => shuffle(options));
  current = 0;
  outcome = null;
  show("quiz", "prompt");
  renderQuestion();
}

function updateProgress() {
  const complete = answers.filter(answer => answer !== null).length;
  el("progress").value = complete;
  el("progress-text").textContent = `已答 ${complete} / ${questions.length}`;
  el("next").disabled = answers[current] === null;
}

function renderQuestion() {
  el("question-number").textContent = `第 ${current + 1} 题`;
  el("prompt").textContent = questions[current][0];
  el("previous").hidden = current === 0;
  el("next").textContent = current === questions.length - 1 ? "查看结果" : "下一题";

  el("choices").replaceChildren(...optionOrders[current].map(([dimension, text]) => {
    const label = make("label", undefined, "choice");
    const input = make("input");
    input.type = "radio";
    input.name = "answer";
    input.value = String(dimension);
    input.checked = answers[current] === dimension;
    label.append(input, make("span", text));
    return label;
  }));

  updateProgress();
  window.scrollTo(0, 0);
  el("prompt").focus({ preventScroll: true });
  animate(el("question-card"));
}

function scoreAnswers() {
  const counts = talents.map(() => 0);
  const first = talents.map(() => questions.length);
  answers.forEach((dimension, index) => {
    counts[dimension]++;
    first[dimension] = Math.min(first[dimension], index);
  });

  // 比较精确比例。并列时，主卡取最早选中的并列维度。
  const compare = (a, b) => counts[b] * opportunities[a] - counts[a] * opportunities[b];
  const ranked = [...indices].sort((a, b) => compare(a, b) || first[a] - first[b]);
  const primary = ranked[0];
  const ties = ranked.slice(1).filter(index => compare(primary, index) === 0);
  const ratios = counts.map((count, index) => count / opportunities[index]);
  return { ratios, primary, ties, ranked };
}

const percent = ratio => `${(ratio * 100).toFixed(1).replace(/\.0$/, "")}%`;

function svg(tag, attrs, label) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
  if (label !== undefined) node.textContent = label;
  return node;
}

function renderRadar(ratios, hue, leaders) {
  const centerX = 180;
  const centerY = 174;
  const radius = 112;
  const labelRadius = 142;
  const top = Math.max(...ratios);
  const scale = top || 1;
  const color = `hsl(${hue} 57% 35%)`;
  const shapes = [];

  function point(index, distance) {
    const angle = index * 2 * Math.PI / talents.length - Math.PI / 2;
    return [centerX + Math.cos(angle) * distance, centerY + Math.sin(angle) * distance];
  }

  const points = vertices => vertices.map(vertex => vertex.join(",")).join(" ");
  for (const level of [1, .75, .5, .25]) {
    shapes.push(svg("polygon", {
      points: points(indices.map(index => point(index, radius * level))),
      fill: level === 1 ? "#f8f2fd" : "none",
      stroke: "#d8cae8"
    }));
  }

  for (const index of indices) {
    const [x, y] = point(index, radius);
    shapes.push(svg("line", { x1: centerX, y1: centerY, x2: x, y2: y, stroke: "#d8cae8" }));
  }

  // 仅缩放图形。顶点到中心的距离等于该维度分数除以本次最高分。
  const vertices = ratios.map((ratio, index) => point(index, radius * ratio / scale));
  shapes.push(svg("polygon", {
    points: points(vertices), fill: color, "fill-opacity": .22,
    stroke: color, "stroke-width": 2.5, "stroke-linejoin": "round"
  }));

  for (const index of indices) {
    const [x, y] = vertices[index];
    const leading = leaders.has(index);
    if (ratios[index] > 0) {
      shapes.push(svg("circle", {
        cx: x, cy: y, r: leading ? 6 : 3.5, fill: color,
        stroke: "#fff", "stroke-width": leading ? 2 : 1
      }));
    }
    const [labelX, labelY] = point(index, labelRadius);
    shapes.push(
      svg("text", {
        x: labelX, y: labelY - 3, "text-anchor": "middle",
        fill: leading ? color : "#281e38", "font-size": 15, "font-weight": leading ? 850 : 650
      }, talents[index][0]),
      svg("text", {
        x: labelX, y: labelY + 14, "text-anchor": "middle",
        fill: leading ? color : "#625570", "font-size": 13, "font-weight": leading ? 750 : 400
      }, percent(ratios[index]))
    );
  }

  el("radar-plot").replaceChildren(...shapes);
  el("radar-desc").textContent = indices.map(index =>
    `${talents[index][0]} ${percent(ratios[index])}`
  ).join("，");
  el("scale-note").textContent =
    `外圈代表本次最高分 ${percent(top)}，其余维度按比例绘制。标签显示实际选中比例。`;
}

function renderResult() {
  outcome = scoreAnswers();
  const [label, name, hue, quote, reason, strength, guide, egg] = talents[outcome.primary];
  const tiedLabels = outcome.ties.map(index => talents[index][0]);

  el("banner").style.setProperty("--hue", hue);
  el("result-label").textContent = `${label}天赋`;
  el("result-title").textContent = name;
  el("quote").textContent = `「${quote}」`;
  el("ties").hidden = tiedLabels.length === 0;
  el("ties").textContent = `同为最高分 · ${tiedLabels.join("、")}`;

  el("details").replaceChildren(...[
    ["匹配理由", reason], ["隐藏优势", strength], ["发展指南", guide], ["趣味彩蛋", egg]
  ].map(([heading, content]) => {
    const card = make("article", undefined, "card");
    card.append(make("h3", heading), make("p", content, "muted"));
    return card;
  }));

  el("scores").replaceChildren(...outcome.ranked.map(index => {
    const row = make("li", undefined, "score");
    const meter = make("span", undefined, "track");
    const fill = make("span");
    fill.style.width = `${outcome.ratios[index] * 100}%`;
    meter.setAttribute("aria-hidden", "true");
    meter.append(fill);
    row.append(make("span", talents[index][0]), meter, make("strong", percent(outcome.ratios[index])));
    return row;
  }));

  renderRadar(outcome.ratios, hue, new Set([outcome.primary, ...outcome.ties]));
  show("result", "result-title");
  animate(el("result"));
}

function drawShareCard() {
  const [label, name, hue, quote] = talents[outcome.primary];
  const canvas = el("poster");
  const ctx = canvas.getContext("2d");
  if (!ctx) return;

  const gradient = ctx.createRadialGradient(540, 490, 90, 540, 730, 940);
  gradient.addColorStop(0, `hsl(${hue} 44% 40%)`);
  gradient.addColorStop(1, `hsl(${hue} 35% 14%)`);
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 1080, 1440);
  ctx.strokeStyle = "#f6e5ff80";
  ctx.lineWidth = 2;
  ctx.strokeRect(34, 34, 1012, 1372);

  ctx.save();
  ctx.translate(540, 510);
  ctx.strokeStyle = "#e9ccffb0";
  for (let index = 0; index < 12; index++) {
    ctx.beginPath();
    ctx.ellipse(0, 0, 260, 130, index * Math.PI / 12, 0, 2 * Math.PI);
    ctx.stroke();
  }
  ctx.restore();

  ctx.textAlign = "center";
  ctx.fillStyle = "#fff6ff";
  ctx.font = "600 34px sans-serif";
  ctx.fillText("测测你的隐藏天赋", 540, 130);
  ctx.fillText(`${label}天赋`, 540, 855);
  ctx.font = "800 94px serif";
  ctx.fillText(name, 540, 976);
  ctx.font = "600 43px serif";

  let line = "";
  let y = 1100;
  for (const char of `「${quote}」`) {
    if (line && ctx.measureText(line + char).width > 850) {
      ctx.fillText(line, 540, y);
      y += 61;
      line = "";
    }
    line += char;
  }
  if (line) ctx.fillText(line, 540, y);

  ctx.font = "500 28px sans-serif";
  if (outcome.ties.length) {
    const names = outcome.ties.map(index => talents[index][0]).join("、");
    ctx.fillText(`同为最高分 · ${names}`, 540, 1274, 900);
  }
  ctx.fillText("趣味人格测试 · 仅供娱乐与自我探索", 540, 1350);
  canvas.setAttribute("aria-label", `${name}。${quote}`);
  el("save-status").textContent = "也可以直接截图";
  el("share-dialog").showModal();
}

function saveShareCard() {
  const filename = `隐藏天赋-${talents[outcome.primary][1]}.png`;
  const button = el("save");
  button.disabled = true;
  el("poster").toBlob(blob => {
    button.disabled = false;
    if (!blob) {
      el("save-status").textContent = "图片生成失败，可以直接截图";
      return;
    }
    const link = make("a");
    const url = URL.createObjectURL(blob);
    link.href = url;
    link.download = filename;
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    el("save-status").textContent = "图片已生成，可查看浏览器下载";
  }, "image/png");
}

el("tags").replaceChildren(...talents.map(([label]) => make("span", label)));
el("progress").max = questions.length;
el("start").addEventListener("click", begin);
el("restart").addEventListener("click", begin);
el("previous").addEventListener("click", () => {
  if (current > 0) {
    current--;
    renderQuestion();
  }
});
el("choices").addEventListener("change", event => {
  if (!event.target.matches('input[type="radio"]:checked')) return;
  answers[current] = Number(event.target.value);
  updateProgress();
});
el("question-form").addEventListener("submit", event => {
  event.preventDefault();
  if (answers[current] === null) return;
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else if (answers.every(answer => answer !== null)) {
    renderResult();
  }
});
el("share").addEventListener("click", drawShareCard);
el("save").addEventListener("click", saveShareCard);
</script>
